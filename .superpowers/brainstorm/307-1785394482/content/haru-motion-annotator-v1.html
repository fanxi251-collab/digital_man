<h3>使用方式</h3>
<ol>
  <li>点击 M01–M26 查看动作；每次只播放一个周期，然后自动回到待机。</li>
  <li>在右侧填写动作适用的回答内容，绿色圆点表示已经填写。</li>
  <li>点击“复制已注释动作”，把结果粘贴回 Codex 对话。</li>
</ol>
