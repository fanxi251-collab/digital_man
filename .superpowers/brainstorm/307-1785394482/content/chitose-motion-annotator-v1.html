<ul>
  <li>描述适用的具体语义，例如“欢迎、初次见面、很高兴为您服务”。</li>
  <li>不同动作尽量不要填写完全相同的含义，减少匹配冲突。</li>
  <li>待机动作作为默认状态，不参与语义抢占。</li>
</ul>
