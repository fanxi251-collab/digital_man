<h3>操作方式</h3>
<ol>
  <li>点击 M01–M26，逐个观察人物的手臂、头部和身体动作。</li>
  <li>遇到合适动作时，点击“设为欢迎 / 讲解 / 思考 / 道歉 / 路线指引”。</li>
  <li>全部选完后点击“复制选择结果”，粘贴回 Codex 对话。</li>
</ol>
