services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # PostgreSQL 18 manages versioned storage below this path, which keeps future major upgrades explicit.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  neo4j:
    image: ${NEO4J_IMAGE:?NEO4J_IMAGE is required}
    restart: unless-stopped
    environment:
      # Enterprise requires explicit acceptance so an unattended Baota restart cannot stall at the license prompt.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:?Neo4j license acceptance is required}
      NEO4J_AUTH: ${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_initial_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
      # Keep the verified transfer archive read-only because restore is a deliberate one-time admin operation.
      - ./neo4j.dump:/backups/neo4j.dump:ro
    ports:
      # Loopback binding permits local/SSH administration without exposing Neo4j Browser to the public network.
      - "127.0.0.1:7474:7474"
    healthcheck:
      test:
        - CMD-SHELL
        - 'user="$${NEO4J_AUTH%%/*}"; password="$${NEO4J_AUTH#*/}"; cypher-shell -a bolt://127.0.0.1:7687 -u "$$user" -p "$$password" "RETURN 1" >/dev/null'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - backend

  app:
    image: lingjing-ai:2026-07-22
    restart: unless-stopped
    init: true
    env_file:
      # Runtime-only application settings remain separate so Compose interpolation credentials stay narrowly scoped.
      - ./app.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      KG_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:?NEO4J_USER is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      # Named volumes preserve mutable indexes and uploads while keeping them outside the immutable application image.
      - app_data:/app/data
      - app_qdrant:/app/qdrant_db
      - app_logs:/app/logs
    ports:
      # Baota Nginx should be the only public entry point and proxy to this loopback listener.
      - "127.0.0.1:8000:8000"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_backups:
  app_data:
  app_qdrant:
  app_logs:
